[project]
name = "yue-voice"
version = "0.1.0"
description = "Cantonese paragraph TTS with bounded SenseVoice verification"
readme = "README.md"
authors = [
    { name = "Pan", email = "kpkong@hk01.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "funasr==1.4.14",
    "omnivoice==0.2.1",
    "soundfile==0.13.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
]

[project.scripts]
yue-voice = "yue_voice:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"
